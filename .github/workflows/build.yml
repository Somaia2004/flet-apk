name: Build Android APK and AAB

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: azkar-APK
          path: ${{ steps.build.outputs.output-path }}/*.apk
          if-no-files-found: error
          archive: false

  build-aab:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build AAB
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: aab
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: azkar-AAB
          path: ${{ steps.build.outputs.output-path }}/*.aab
          if-no-files-found: error
          archive: false
