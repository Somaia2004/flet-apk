name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5
          pip install flet-audio

      - name: Build APK
        run: |
          flet build apk \
            --project "اذكار الصباح و المساء" \
            --product "اذكار الصباح و المساء" \
            --icon icon.PNG \
            --assets .

      - name: Build AAB
        run: |
          flet build aab \
            --project "اذكار الصباح و المساء" \
            --product "اذكار الصباح و المساء" \
            --icon icon.PNG \
            --assets .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: اذكار-الصباح-والمساء-APK
          path: build/**/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: اذكار-الصباح-والمساء-AAB
          path: build/**/*.aab
          if-no-files-found: error
