name: Build APK and AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.86.5"
          pip install flet-audio

      - name: Prepare assets
        run: |
          mkdir -p assets
          cp icon.PNG assets/icon.PNG
          cp 002255.mp3 assets/002255.mp3
          cp 112.mp3 assets/112.mp3
          cp 113.mp3 assets/113.mp3
          cp 114.mp3 assets/114.mp3

      - name: Build APK
        run: |
          flet build apk \
            --verbose \
            --product "اذكار الصباح و المساء" \
            --icon assets/icon.PNG \
            --assets assets

      - name: Build AAB
        run: |
          flet build aab \
            --verbose \
            --product "اذكار الصباح و المساء" \
            --icon assets/icon.PNG \
            --assets assets

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: اذكار-الصباح-والمساء-APK
          path: build/**/*.apk
          if-no-files-found: error

      - name: Upload AAB only
        uses: actions/upload-artifact@v4
        with:
          name: اذكار-الصباح-والمساء-AAB
          path: build/**/*.aab
          if-no-files-found: error
