name: Build Flet Android

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"

      - name: Prepare Temporary Dependencies
        run: |
          cat > requirements.txt <<'EOF'
          flet==0.86.5
          flet-audio==0.86.5
          EOF

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5
          python -m pip install flet-audio==0.86.5

      - name: Prepare App Icon
        run: |
          mkdir -p assets
          cp icon.PNG assets/icon.png

      - name: Prepare Audio Files
        run: |
          cp 002255.mp3 assets/002255.mp3
          cp 112.mp3 assets/112.mp3
          cp 113.mp3 assets/113.mp3
          cp 114.mp3 assets/114.mp3

      - name: Verify Required Files
        run: |
          test -f main.py
          test -f icon.PNG
          test -f 002255.mp3
          test -f 112.mp3
          test -f 113.mp3
          test -f 114.mp3

          echo "All required files are present."

      - name: Build APK
        run: |
          flet build apk --release --yes \
            --product "أذكار الصباح و المساء"

      - name: Build AAB
        run: |
          flet build aab --release --yes \
            --product "أذكار الصباح و المساء"

      - name: Find APK and AAB
        run: |
          echo "Searching for APK and AAB files..."
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Verify APK and AAB
        run: |
          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)
          AAB_COUNT=$(find . -type f -name "*.aab" | wc -l)

          echo "APK files found: $APK_COUNT"
          echo "AAB files found: $AAB_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: No AAB file was generated."
            exit 1
          fi

          echo "APK and AAB were generated successfully."

      - name: Prepare Final ZIP
        run: |
          mkdir -p final_package

          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          AAB_FILE=$(find . -type f -name "*.aab" | head -n 1)

          echo "APK: $APK_FILE"
          echo "AAB: $AAB_FILE"

          cp "$APK_FILE" final_package/azkar.apk
          cp "$AAB_FILE" final_package/azkar.aab

          cd final_package
          zip -q ../azkar-android.zip azkar.apk azkar.aab
          cd ..

          echo "Final ZIP created:"
          ls -lh azkar-android.zip

      - name: Verify ZIP Contents
        run: |
          echo "ZIP contents:"
          unzip -l azkar-android.zip

          FILE_COUNT=$(unzip -Z1 azkar-android.zip | wc -l)

          if [ "$FILE_COUNT" -ne 2 ]; then
            echo "ERROR: ZIP must contain exactly 2 files."
            exit 1
          fi

          unzip -Z1 azkar-android.zip | grep -qx "azkar.apk"
          unzip -Z1 azkar-android.zip | grep -qx "azkar.aab"

          echo "ZIP verified successfully."
          echo "Contains only:"
          echo "- azkar.apk"
          echo "- azkar.aab"

      - name: Upload Final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: azkar-android
          path: azkar-android.zip
          if-no-files-found: error
