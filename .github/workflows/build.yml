```yaml
name: Build Flet Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5
          python -m pip install flet-audio==0.86.5

      - name: Prepare App Icon
        run: |
          mkdir -p assets
          cp icon.PNG assets/icon.png

      - name: Prepare Audio Files
        run: |
          cp 002255.mp3 assets/002255.mp3
          cp 112.mp3 assets/112.mp3
          cp 113.mp3 assets/113.mp3
          cp 114.mp3 assets/114.mp3

      - name: Prepare Temporary Dependencies
        run: |
          printf '%s\n' \
            'flet==0.86.5' \
            'flet-audio==0.86.5' \
            > requirements.txt

      - name: Build APK
        run: |
          flet build apk --yes \
            --product "أذكار الصباح و المساء"

      - name: Build AAB
        run: |
          flet build aab --yes \
            --product "أذكار الصباح و المساء"

      - name: Find APK and AAB
        run: |
          echo "Searching for APK and AAB files..."
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Prepare Final ZIP
        run: |
          mkdir -p final_package

          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          AAB_FILE=$(find . -type f -name "*.aab" | head -n 1)

          cp "$APK_FILE" final_package/azkar.apk
          cp "$AAB_FILE" final_package/azkar.aab

          cd final_package
          zip ../azkar-android.zip azkar.apk azkar.aab
          cd ..

          echo "Final package:"
          unzip -l azkar-android.zip

      - name: Verify Final ZIP
        run: |
          if [ ! -f "azkar-android.zip" ]; then
            echo "ERROR: ZIP file was not created."
            exit 1
          fi

          APK_IN_ZIP=$(unzip -l azkar-android.zip | grep -c "azkar.apk")
          AAB_IN_ZIP=$(unzip -l azkar-android.zip | grep -c "azkar.aab")

          if [ "$APK_IN_ZIP" -ne 1 ]; then
            echo "ERROR: APK is missing from ZIP."
            exit 1
          fi

          if [ "$AAB_IN_ZIP" -ne 1 ]; then
            echo "ERROR: AAB is missing from ZIP."
            exit 1
          fi

          echo "ZIP verified successfully."
          echo "Contains only:"
          echo " - azkar.apk"
          echo " - azkar.aab"

      - name: Upload Final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: azkar-android
          path: azkar-android.zip
          if-no-files-found: error
```
